name: Build C++20 Project

on:
  push:
    branches: [ github-auto-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev \
            libx11-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdrm-dev \
            libglvnd-dev

      - name: Build project
        run: |
          mkdir ./build
          cd ./build
          cmake ..
          cmake --build . -j$(nproc)
          ls
